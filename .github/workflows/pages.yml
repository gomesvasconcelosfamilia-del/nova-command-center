name: Publish NOVA Command Center
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare allowlisted public artifact
        run: |
          mkdir -p site
          cp index.html site/index.html
          test "$(find site -type f | wc -l)" -eq 1
          ! grep -Eiq 'github.com/gomesvasconcelosfamilia-del/(novarawplugin|nova-operator|nova-bridge|ABLETON-NOVA-BRIDGE)|ghp_[A-Za-z0-9]+' site/index.html
      - name: Upload only approved static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
