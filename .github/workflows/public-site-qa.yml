name: Public site quality gate
on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/check_public_site.py
      - .github/workflows/public-site-qa.yml
  pull_request:
    paths:
      - index.html
      - scripts/check_public_site.py
      - .github/workflows/public-site-qa.yml
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-site-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public content and links
        run: python scripts/check_public_site.py
      - name: Verify public site responds
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --max-time 20 --output /dev/null "https://gomesvasconcelosfamilia-del.github.io/nova-command-center/"
